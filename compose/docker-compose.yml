services:
  postgres:
     Mau bikin, mau bikin Ini. Baca dulu, baca Ude. Hm? Yang What a dua! No, I do, honey. Di meja dapur di I Eh, You Text It was in a dikit, emang. Yang Kenapa? Enggak tahu, Kayaknya asam lambungnya naik kali, mohon maaf. Makanya Yes, but that's fine. So, you want to see? Yeah, how 20 teh. Per orang. Per orang. Kalau, kalau diantar doang 15 maksudnya. Bye!
    container_name: jaganapas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jaganapas}
      POSTGRES_USER: ${POSTGRES_USER:-jaganapas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaganapas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jaganapas} -d ${POSTGRES_DB:-jaganapas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jaganapas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-ui:
    image: redis/redisinsight:latest
    container_name: jaganapas-redis-ui
    restart: unless-stopped
    ports:
      - "8081:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
